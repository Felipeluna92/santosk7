<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Bot Lab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/collector.js"></script>
</head>
<body>
  <main class="card">
    <h1>Entrar</h1>
    <p class="sub">Aplicação local do laboratório de detecção.</p>
    <form data-kind="login" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <div class="error" data-error-for="email"></div>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="error" data-error-for="password"></div>

      <div class="hp" aria-hidden="true">
        <label for="website">Site</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button id="submit" type="submit">Entrar</button>
      <div class="error" data-error-for="_"></div>
    </form>
    <p class="alt">Não tem conta? <a href="/signup" data-keep-label>Cadastrar</a></p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
